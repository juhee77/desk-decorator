<!DOCTYPE html>
<!-- desk-decorator v3 -->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책상 꾸미기 🌸 나만의 감성 공간</title>
    <meta name="description" content="나만의 감성 책상을 꾸며보세요! 드래그 앤 드롭으로 아이템을 배치하고, 저장하고, 공유하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 토스트 알림 -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-icon">🌸</span>
                나만의 책상 꾸미기
            </h1>
            <p class="subtitle">감성 가득한 나만의 공간을 만들어보세요 ✨</p>

            <!-- 테마 선택 -->
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="sunset" id="themeSunset" title="노을">
                    <span>🌅</span> 노을
                </button>
                <button class="theme-btn" data-theme="night" id="themeNight" title="야경">
                    <span>🌙</span> 야경
                </button>
                <button class="theme-btn" data-theme="forest" id="themeForest" title="숲">
                    <span>🌿</span> 숲
                </button>
                <button class="theme-btn" data-theme="ocean" id="themeOcean" title="바다">
                    <span>🌊</span> 바다
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- 모바일 탭 -->
            <div class="mobile-tabs" id="mobileTabs">
                <button class="tab-btn active" data-tab="palette" id="tabPalette">
                    <i class="fas fa-th"></i> 아이템
                </button>
                <button class="tab-btn" data-tab="desk" id="tabDesk">
                    <i class="fas fa-desktop"></i> 내 책상
                </button>
            </div>

            <!-- 아이템 팔레트 -->
            <aside class="palette" id="palettePanel">
                <h2 class="palette-title">
                    <i class="fas fa-magic"></i> 아이템 팔레트
                </h2>

                <!-- 카테고리 탭 -->
                <div class="category-tabs">
                    <button class="cat-tab active" data-cat="study">
                        <i class="fas fa-book"></i><span>학용품</span>
                    </button>
                    <button class="cat-tab" data-cat="plants">
                        <i class="fas fa-leaf"></i><span>식물</span>
                    </button>
                    <button class="cat-tab" data-cat="deco">
                        <i class="fas fa-star"></i><span>장식</span>
                    </button>
                    <button class="cat-tab" data-cat="drinks">
                        <i class="fas fa-mug-hot"></i><span>음료</span>
                    </button>
                    <button class="cat-tab" data-cat="hobby">
                        <i class="fas fa-palette"></i><span>취미</span>
                    </button>
                </div>

                <!-- 아이템 그리드 (JS로 렌더링) -->
                <div class="items-grid" id="itemsGrid"></div>

                <!-- 팔레트 하단 힌트 -->
                <div class="palette-hint">
                    <i class="fas fa-hand-pointer"></i> 클릭 또는 드래그로 배치
                </div>
            </aside>

            <!-- 책상 영역 -->
            <main class="desk-area" id="deskPanel">
                <div class="desk-container" id="deskContainer">
                    <div class="desk-surface" id="deskSurface">
                        <div class="desk-hint" id="deskHint">
                            <div class="hint-icon">✨</div>
                            <p>아이템을 드래그하거나 클릭해서 배치해봐!</p>
                            <p class="hint-small">배치된 아이템은 자동으로 저장돼요 💾</p>
                        </div>
                    </div>
                </div>

                <!-- 데일리 챌린지 -->
                <div class="challenge-widget" id="challengeWidget">
                    <div class="challenge-inner">
                        <span class="challenge-emoji" id="challengeEmoji">🎯</span>
                        <div class="challenge-body">
                            <div class="challenge-label">오늘의 챌린지</div>
                            <div class="challenge-title" id="challengeTitle">집중 모드</div>
                            <div class="challenge-desc" id="challengeDesc">로딩 중...</div>
                        </div>
                        <div class="challenge-right">
                            <div class="challenge-count" id="challengeCount">0/5</div>
                            <div class="challenge-track"><div class="challenge-fill" id="challengeFill" style="width:0%"></div></div>
                        </div>
                    </div>
                    <div class="challenge-done" id="challengeDone">🎉 챌린지 완료! 오늘도 최고예요!</div>
                </div>

                <!-- 컨트롤 버튼 -->
                <div class="controls">
                    <button class="btn btn-save" id="saveBtn">
                        <i class="fas fa-camera"></i>
                        <span>스크린샷</span>
                    </button>
                    <button class="btn btn-random" id="randomBtn">
                        <i class="fas fa-dice"></i>
                        <span>랜덤 배치</span>
                    </button>
                    <button class="btn btn-analyze" id="analyzeBtn">
                        <i class="fas fa-magic"></i>
                        <span>취향 분석</span>
                    </button>
                    <button class="btn btn-clear" id="clearBtn">
                        <i class="fas fa-trash"></i>
                        <span>전체 삭제</span>
                    </button>
                </div>

                <!-- 통계 -->
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label"><i class="fas fa-layer-group"></i> 배치된 아이템</span>
                        <span class="stat-value" id="itemCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i class="fas fa-save"></i> 마지막 저장</span>
                        <span class="stat-value stat-time" id="lastSaved">—</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 아이템 크기 조절 툴킷 (선택된 아이템에 표시) -->
    <div class="item-toolkit" id="itemToolkit">
        <button class="toolkit-btn" id="scaleUp" title="크게"><i class="fas fa-plus"></i></button>
        <button class="toolkit-btn" id="scaleDown" title="작게"><i class="fas fa-minus"></i></button>
        <button class="toolkit-btn danger" id="deleteItem" title="삭제"><i class="fas fa-times"></i></button>
    </div>

    <!-- 🎵 음악 위젯 -->
    <div class="music-widget" id="musicWidget">
        <button class="music-fab" id="musicFab" title="Lofi BGM">
            <span class="music-fab-icon" id="musicFabIcon">🎵</span>
        </button>
        <div class="music-panel" id="musicPanel">
            <div class="music-panel-header">
                <div class="vinyl" id="vinyl"><div class="vinyl-inner"><div class="vinyl-dot"></div></div></div>
                <div class="music-meta">
                    <div class="music-track" id="musicTrack">Lofi Chill</div>
                    <div class="music-sub">beats to study / relax</div>
                </div>
                <button class="music-close-btn" id="musicCloseBtn"><i class="fas fa-chevron-down"></i></button>
            </div>
            <div class="music-controls-row">
                <button class="music-play-btn" id="musicPlayBtn"><i class="fas fa-play" id="musicPlayIcon"></i></button>
                <div class="music-vol-row">
                    <i class="fas fa-volume-up" style="font-size:.75rem;opacity:.6"></i>
                    <input type="range" class="music-vol-slider" id="musicVol" min="0" max="100" value="60">
                </div>
            </div>
            <div id="ytPlayerWrap" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;"></div>
        </div>
    </div>

    <!-- 🔮 취향 분석 모달 -->
    <div class="modal-overlay" id="resultOverlay">
        <div class="result-wrap">
            <button class="result-close-btn" id="resultClose"><i class="fas fa-times"></i></button>
            <div class="result-card" id="resultCard"></div>
            <button class="result-save-btn" id="resultSaveBtn"><i class="fas fa-download"></i> 카드 저장</button>
        </div>
    </div>

    <script src="items-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
