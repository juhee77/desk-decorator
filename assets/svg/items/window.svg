<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Window Frame -->
  <rect x="5" y="5" width="90" height="110" rx="2" fill="#d1ccc0" />
  <rect x="10" y="10" width="80" height="100" rx="1" fill="#f5f6fa" />
  
  <!-- Glass Panes -->
  <rect x="15" y="15" width="32" height="42" fill="#afb8d0" opacity="0.4" />
  <rect x="53" y="15" width="32" height="42" fill="#afb8d0" opacity="0.4" />
  <rect x="15" y="63" width="32" height="42" fill="#afb8d0" opacity="0.4" />
  <rect x="53" y="63" width="32" height="42" fill="#afb8d0" opacity="0.4" />
  
  <!-- Mullions -->
  <rect x="47" y="10" width="6" height="100" fill="#d1ccc0" />
  <rect x="10" y="57" width="80" height="6" fill="#d1ccc0" />
  
  <!-- Raindrop Layer (will be animated in CSS) -->
  <g class="raindrops" style="display:none">
    <rect x="20" y="20" width="1" height="5" fill="#fff" opacity="0.6" rx="0.5" class="drop d1" />
    <rect x="60" y="30" width="1" height="5" fill="#fff" opacity="0.6" rx="0.5" class="drop d2" />
    <rect x="30" y="70" width="1" height="5" fill="#fff" opacity="0.6" rx="0.5" class="drop d3" />
    <rect x="75" y="80" width="1" height="5" fill="#fff" opacity="0.6" rx="0.5" class="drop d4" />
  </g>
</svg>
